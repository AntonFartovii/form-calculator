<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
    <title>Калькулятор</title>
    <style>
        .container * {
            width: inherit;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 900px;
            margin: 20px auto;
            text-transform: uppercase;
            font-family: 'Inter,  sans-serif';
            padding: 6px;
            color: #393838;
        }

        .h2 {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }

        .label {
            font-weight: 600;
            font-size: 16px;
            padding: 10px 0;
            display: flex;
            align-items: center;
        }

        .range-box {
            display: flex;
            justify-content: space-between;
        }

        .range-box span {
            width: min-content;
            font-weight: 500;
            font-size: 16px;
            padding: 5px 0;
        }

        .result {
            font-weight: 600;
            font-size: 16px;
            color: #FF008B;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            height: 2px;
            border-radius: 5px;
            background: #FF008B;
            outline: none;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
        }

        /* Бегунок */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #FF008B;
            cursor: pointer;
            margin-top: -7px;
        }
        input[type="range"]::-ms-tooltip {
            visibility: visible;
            width: 20px;
            height: 20px;
        }

        .value {
            border: 1px dotted #FF008B;
            padding: 3px 6px;
            margin: 0 5px;
            max-width: 50px;
            text-align: center;
        }

    </style>
</head>
<body>

<div class="container">
    <span class="h2">Расчёт оплаты таргетолога</span>
    <label class="label" for="slider1">Количество клиентов в месяц <div class="value" id="value1"></div></label>
    <input type="range" id="slider1" min="1" max="10" value="1">
    <div class="range-box"><span>1</span><span>10</span></div>

    <label class="label" for="slider2">Стоимость ведения одного проекта, $ <div class="value" id="value2"></div></label>
    <input type="range" id="slider2" min="1" max="1000" value="1" >
    <div class="range-box"><span>1</span><span>100</span></div>


    <div class="result">Заработная плата в итоге составит - <span id="result">1</span>&nbsp;$</div>
</div>


<script>
    const slider1 = document.getElementById('slider1');
    const slider2 = document.getElementById('slider2');
    const result = document.getElementById('result');
    const value1 = document.getElementById('value1');
    const value2 = document.getElementById('value2');

    function calculate() {
        const val1 = parseInt(slider1.value, 10);
        const val2 = parseInt(slider2.value, 10);
        result.textContent = val1 * val2;
        value1.textContent = val1;
        value2.textContent = val2;
    }
    slider1.addEventListener('input', calculate);
    slider2.addEventListener('input', calculate);

    calculate();


</script>

</body>
</html>
